/* A viewport-sized tabletop. Only the match scene is locked; menus and documents scroll normally. */
body.tabletop-active{height:100dvh;min-height:0;overflow:hidden;padding:0}
#app[data-scene="table"]{--table-header:48px;--table-card:160px;--table-console:50px;--table-dock:266px;--shrine-width:160px;display:grid;grid-template-rows:var(--table-header) minmax(0,1fr);height:100dvh;min-height:0;max-height:100dvh;overflow:hidden;background-attachment:scroll}
#app[data-scene="table"]>.topbar{height:var(--table-header);min-height:0;max-width:1440px;width:100%;padding:5px 18px;margin:0 auto;border-top:0;border-radius:0;box-shadow:none;gap:12px;overflow:hidden}
[data-scene="table"] .brand{gap:8px}.brand-title{transition:none}
[data-scene="table"] .brand-title{font-size:23px;letter-spacing:4px;line-height:1.2}[data-scene="table"] .brand small{display:none}[data-scene="table"] .brand-icon,[data-scene="table"] .brand-icon svg{width:27px;height:27px}
[data-scene="table"] .topbar-seal{font-size:11px;letter-spacing:2px;gap:12px}[data-scene="table"] .topbar-seal i{width:28px}[data-scene="table"] .topbar-seal span{border:0;background:none;padding:0;box-shadow:none}
[data-scene="table"] .top-actions{gap:5px;max-width:none;flex-wrap:nowrap}[data-scene="table"] .top-actions .btn{padding:7px 9px;font-size:11px;white-space:nowrap}[data-scene="table"] .top-actions .btn svg{width:15px;height:15px}
[data-scene="table"] .game-wrap{display:grid;grid-template-rows:var(--table-status,28px) minmax(0,1fr);width:100%;height:100%;min-height:0;max-width:1440px;gap:6px;margin:0 auto;padding:6px 12px 10px;overflow:hidden}
[data-scene="table"] .game-status{display:flex;align-items:center;min-height:0;height:var(--table-status,28px);padding:0 4px;gap:12px;flex-wrap:nowrap;overflow:hidden}

<body><main id="app"></main><div id="battle-fx-stage" aria-hidden="true"></div><div id="gesture-stage" data-gesture-layer aria-hidden="true"></div><div id="ritual-stage" aria-live="polite" aria-atomic="true"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>/* Element Jue — rules and fair-information bot policy. No DOM dependencies. */
(function(root){
'use strict';
const ELEMENTS=['金','木','水','火','土'];
const BEATS={金:'木',木:'土',土:'水',水:'火',火:'金'};
const COUNTER={金:'火',木:'金',土:'木',水:'土',火:'水'};
const TOOLS={掠夺:5,恢复:10,揽月:10,护盾:5};
const clone=x=>JSON.parse(JSON.stringify(x));
function catalogue(){
 const a=[];
 for(const e of ELEMENTS)for(let i=0;i<15;i++)a.push({id:`e-${e}-${i}`,type:'element',name:e,element:e});
 for(const [name,n]of Object.entries(TOOLS))for(let i=0;i<n;i++)a.push({id:`t-${name}-${i}`,type:'tool',name});
 for(const e of ELEMENTS)for(let i=0;i<2;i++)a.push({id:`i-${e}-${i}`,type:'identity',name:e,element:e});
 for(let i=0;i<6;i++)a.push({id:`h-${i}`,type:'health',name:'血量'});
 return a;
}
class Game{
 constructor(config,options={}){
  if(config.length<2||config.length>5)throw Error('请选择2—5名玩家');
  if(!options.testing&&!config.some(p=>p.type==='human'))throw Error('至少需要1名真人');
  const seed=(options.seed??Math.floor(Math.random()*4294967295))>>>0;
  this.s={version:1,rng:seed||17,rev:0,phase:'identity',choiceIndex:0,turn:0,starter:0,turnCount:0,
   used:{attack:false,tool:false},pending:null,deck:[],discard:[],out:[],players:[],dist:[],logs:[],winners:[],reason:'',setup:clone(config)};
  const cards=catalogue(),ids=this.shuffle(cards.filter(c=>c.type==='identity'));
  const hp=cards.filter(c=>c.type==='health');
  this.s.deck=this.shuffle(cards.filter(c=>c.type==='element'||c.type==='tool').filter(c=>!(config.length===2&&c.name==='揽月')));
  if(config.length===2)this.s.out.push(...cards.filter(c=>c.name==='揽月'));
  this.s.players=config.map((p,i)=>({id:i,name:String(p.name||`玩家${i+1}`).slice(0,16),type:p.type==='bot'?'bot':'human',level:p.level||'medium',
   hp:4,alive:true,hand:[],shield:null,element:null,identityCard:null,healthCard:hp[i],candidates:ids.splice(0,2)}));
  this.s.out.push(...ids,...hp.slice(config.length));
  this.s.dist=config.map((_,i)=>config.map((_,j)=>i===j?0:1));
  this.log('五行归位。每人从两张人物卡中选择身份。');
  this.advanceIdentity();
 }
 static restore(data){
  if(!data||data.version!==1||!Array.isArray(data.players))throw Error('存档版本不兼容');
  const g=Object.create(Game.prototype);g.s=clone(data);g.assert();return g;
 }
 random(){let x=this.s.rng;x^=x<<13;x^=x>>>17;x^=x<<5;this.s.rng=x>>>0;return this.s.rng/4294967296;}
 shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(this.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
 log(text){this.s.logs.push({text,turn:this.s.turnCount});if(this.s.logs.length>70)this.s.logs.shift();}
 actor(){const s=this.s;if(s.phase==='identity')return s.players[s.choiceIndex];if(s.phase==='response')return s.players[s.pending.target];if(s.phase==='action'||s.phase==='discard')return s.players[s.turn];return null;}
 advanceIdentity(){
  while(this.s.choiceIndex<this.s.players.length){
   const p=this.s.players[this.s.choiceIndex];if(p.type==='human')return;
   this.setIdentity(p,p.candidates[Math.floor(this.random()*p.candidates.length)].id);this.s.choiceIndex++;
  }
  this.begin();
 }
 setIdentity(p,id){const c=p.candidates.find(c=>c.id===id);if(!c)throw Error('请选择获得的人物卡');p.identityCard=c;p.element=c.element;this.s.out.push(...p.candidates.filter(c=>c.id!==id));p.candidates=[];this.log(`${p.name}选择了「${p.element}」身份。`);}
 begin(){
  const s=this.s;s.starter=Math.floor(this.random()*s.players.length);s.turn=s.starter;
  for(const p of s.players)this.draw(p,p.id===s.starter?7:5);
  s.turnCount=1;s.phase='action';this.log(`${s.players[s.starter].name}为起始玩家，初始7张手牌，首回合跳过摸牌。`);
 }
 draw(p,n){
  for(let i=0;i<n;i++){
   if(!this.s.deck.length&&this.s.discard.length){this.s.deck=this.shuffle(this.s.discard);this.s.discard=[];this.log('牌库用尽，弃牌堆重新洗入牌库。');}
   if(!this.s.deck.length){this.finishByRank();return false;}
   p.hand.push(this.s.deck.pop());
  }
  return true;
 }
 dispatch(a){
  const s=this.s,p=this.actor();
  try{
   if(a.rev!==undefined&&a.rev!==s.rev)throw Error('操作已过期，请重新选择');
   if(!p||a.actor!==p.id)throw Error('现在不是你的操作阶段');
   if(a.kind==='identity'){
    if(s.phase!=='identity')throw Error('身份已经确定');
    this.setIdentity(p,a.card);s.choiceIndex++;this.advanceIdentity();
   }else if(a.kind==='respond')this.respond(a,p);
   else if(a.kind==='discard')this.discardCards(a,p);
   else{
    if(s.phase!=='action'||!p.alive)throw Error('现在不能进行行动');
    if(a.kind==='attack')this.attack(a,p);
    else if(a.kind==='tool')this.tool(a,p);
    else if(a.kind==='end')this.endTurn(p);
    else throw Error('未知操作');
   }
   s.rev++;return {ok:true};
  }catch(e){return {ok:false,error:e.message};}
 }
 card(p,id){const c=p.hand.find(c=>c.id===id);if(!c)throw Error('这张牌不在你的手牌中');return c;}
 take(p,id){const i=p.hand.findIndex(c=>c.id===id);return p.hand.splice(i,1)[0];}
 target(id,p,allowSelf=false){const t=this.s.players[id];if(!t||!t.alive||(!allowSelf&&t.id===p.id))throw Error('请选择合法的存活目标');return t;}
 damage(c,t){return BEATS[c.element]===t.element?2:1;}
 attack(a,p){
  const s=this.s;if(s.used.attack)throw Error('本回合已攻击过');
  const c=this.card(p,a.card);if(c.type!=='element')throw Error('攻击需要基础元素牌');
  const t=this.target(a.target,p);if(s.dist[p.id][t.id]!==1)throw Error('只能攻击距离为1的玩家');
  const damage=this.damage(c,t);s.pending={card:this.take(p,c.id),attacker:p.id,target:t.id,element:c.element,damage};s.used.attack=true;s.phase='response';
  this.log(`${p.name}以「${c.element}」攻击${t.name}，伤害${damage}${damage===2?'（身份克制）':''}。`);
 }
 respond(a,p){
  const s=this.s;if(s.phase!=='response'||!s.pending)throw Error('没有等待结算的攻击');
  const hit=s.pending;let remaining=hit.damage;
  if(a.mode==='counter'){
   const ids=a.cards||[];
   if(!ids.length||ids.length>hit.damage||new Set(ids).size!==ids.length)throw Error('请选择正确数量的反制牌');
   const cards=ids.map(id=>this.card(p,id));
   if(cards.some(c=>c.type!=='element'||c.element!==COUNTER[hit.element]))throw Error(`本次只能用「${COUNTER[hit.element]}」反制`);
   for(const c of cards)s.discard.push(this.take(p,c.id));remaining-=cards.length;
   this.log(`${p.name}打出${cards.length}张「${COUNTER[hit.element]}」反制，抵消${cards.length}点伤害。`);
  }else if(a.mode==='shield'){
   if(!p.shield)throw Error('没有已经预置的护盾');s.discard.push(p.shield);p.shield=null;remaining=0;this.log(`${p.name}消耗护盾，抵消本次全部伤害。`);
  }else if(a.mode!=='take')throw Error('请选择防守方式');
  s.discard.push(hit.card);s.pending=null;p.hp=Math.max(0,p.hp-remaining);
  if(remaining)this.log(`${p.name}受到${remaining}点伤害，剩余${p.hp}血。`);
  else this.log(`${p.name}成功抵消伤害。`);
  if(p.hp===0)this.kill(p);
  if(this.checkVictory())return;
  this.unlockDistances();s.phase='action';
 }
 tool(a,p){
  const s=this.s,c=this.card(p,a.card);if(c.type!=='tool')throw Error('请选择道具牌');
  if(c.name==='护盾'){
   if(p.shield)throw Error('最多同时拥有1个护盾');p.shield=this.take(p,c.id);this.log(`${p.name}预置了护盾。`);return;
  }
  if(s.used.tool)throw Error('本回合已使用主动道具');
  const t=this.target(a.target,p,c.name==='恢复');
  if(c.name==='恢复'&&t.hp>=4)throw Error('满血玩家不需要恢复');
  if(c.name==='揽月'&&(s.setup.length===2||s.dist[p.id][t.id]!==1))throw Error('该目标不能再次使用揽月');
  s.discard.push(this.take(p,c.id));s.used.tool=true;
  if(c.name==='恢复'){t.hp++;this.log(`${p.name}使用恢复，${t.name}恢复至${t.hp}血。`);}
  if(c.name==='掠夺'){
   const n=Math.min(2,t.hand.length);for(let i=0;i<n;i++){const k=Math.floor(this.random()*t.hand.length);p.hand.push(t.hand.splice(k,1)[0]);}
   this.log(`${p.name}从${t.name}随机掠夺了${n}张手牌。`);
  }
  if(c.name==='揽月'){s.dist[p.id][t.id]=s.dist[t.id][p.id]=2;this.log(`${p.name}对${t.name}使用揽月，双方距离变为2。`);this.unlockDistances();}
 }
 kill(p){
  const s=this.s;p.alive=false;s.discard.push(...p.hand);p.hand=[];
  if(p.shield){s.discard.push(p.shield);p.shield=null;}
  if(p.identityCard){s.out.push(p.identityCard);p.identityCard=null;}
  if(p.healthCard){s.out.push(p.healthCard);p.healthCard=null;}
  for(let i=0;i<s.players.length;i++)s.dist[p.id][i]=s.dist[i][p.id]=0;
  this.log(`${p.name}血量归零，退出对局。`);
 }
 unlockDistances(){
  const living=this.s.players.filter(p=>p.alive);if(living.length<2)return;
  if(living.some(p=>living.some(t=>p.id!==t.id&&this.s.dist[p.id][t.id]===1)))return;
  for(const p of living)for(const t of living)if(p.id!==t.id)this.s.dist[p.id][t.id]=1;
  this.log('无可攻击的玩家对，揽月结界解除。');
 }
 endTurn(p){if(p.hand.length>p.hp*2){this.s.phase='discard';return;}this.nextTurn();}
 discardCards(a,p){
  if(this.s.phase!=='discard')throw Error('现在不是弃牌阶段');
  const n=Math.max(0,p.hand.length-p.hp*2),ids=a.cards||[];
  if(ids.length!==n||new Set(ids).size!==n)throw Error(`必须弃置${n}张牌`);
  ids.forEach(id=>this.card(p,id));for(const id of ids)this.s.discard.push(this.take(p,id));this.log(`${p.name}弃置${n}张牌，手牌回到上限${p.hp*2}。`);this.nextTurn();
 }
 nextTurn(){
  if(this.checkVictory())return;const s=this.s;
  do{s.turn=(s.turn+1)%s.players.length;}while(!s.players[s.turn].alive);
  s.turnCount++;s.used={attack:false,tool:false};s.phase='draw';const p=s.players[s.turn];
  if(!this.draw(p,2))return;s.phase='action';this.log(`第${s.turnCount}回合 · ${p.name}摸2张牌。`);
 }
 checkVictory(){const live=this.s.players.filter(p=>p.alive);if(live.length===1){this.finish([live[0].id],'最后一名存活玩家');return true;}return this.s.phase==='over';}
 finishByRank(){
  const p=this.s.players.filter(p=>p.alive);const hp=Math.max(...p.map(p=>p.hp));const a=p.filter(p=>p.hp===hp);const n=Math.max(...a.map(p=>p.hand.length));
  this.finish(a.filter(p=>p.hand.length===n).map(p=>p.id),'牌库与弃牌堆均为空，依血量与手牌数判定');
 }
 finish(winners,reason){this.s.winners=winners;this.s.reason=reason;this.s.phase='over';this.log(`${winners.map(i=>this.s.players[i].name).join('、')}${winners.length>1?'并列':'获得'}胜利。`);}
 publicView(id){
  const s=this.s,p=s.players[id];return {rev:s.rev,phase:s.phase,turn:s.turn,turnCount:s.turnCount,used:{...s.used},
   self:{id:p.id,name:p.name,hp:p.hp,element:p.element,alive:p.alive,hand:p.hand.map(c=>({...c})),hasShield:!!p.shield,level:p.level},
   players:s.players.map(t=>({id:t.id,name:t.name,hp:t.hp,element:t.element,alive:t.alive,handCount:t.hand.length,hasShield:!!t.shield})),
   dist:s.dist.map(a=>a.slice()),pending:s.pending?{attacker:s.pending.attacker,target:s.pending.target,element:s.pending.element,damage:s.pending.damage}:null};
 }
 assert(){
  const s=this.s,all=[...s.deck,...s.discard,...s.out];
  for(const p of s.players){all.push(...p.hand,...p.candidates);if(p.identityCard)all.push(p.identityCard);if(p.healthCard)all.push(p.healthCard);if(p.shield)all.push(p.shield);}
  if(s.pending)all.push(s.pending.card);
  const expected=catalogue(),names=new Map(expected.map(c=>[c.id,c]));
  if(all.length!==121||new Set(all.map(c=>c.id)).size!==121||all.some(c=>!names.has(c.id)))throw Error('卡牌数量或编号异常');
  if(all.some(c=>{const e=names.get(c.id);return c.type!==e.type||c.name!==e.name||c.element!==e.element;}))throw Error('卡牌内容异常');
  if(s.players.length<2||s.players.length>5)throw Error('玩家人数异常');
  if(!['identity','action','response','discard','draw','over'].includes(s.phase))throw Error('对局阶段异常');
  for(const p of s.players){
   if(p.hp<0||p.hp>4||p.alive!==(p.hp>0))throw Error('血量异常');
   if(p.hand.some(c=>!['element','tool'].includes(c.type)))throw Error('人物或血量牌进入手牌');
   if(p.shield&&p.shield.name!=='护盾')throw Error('护盾异常');
   for(const t of s.players){const d=s.dist[p.id]?.[t.id];if(d!==s.dist[t.id]?.[p.id]||![0,1,2].includes(d))throw Error('距离异常');}
  }
  if(s.deck.some(c=>!['element','tool'].includes(c.type)))throw Error('牌库类型异常');
  if(s.setup.length===2&&[...s.deck,...s.discard,...s.players.flatMap(p=>p.hand)].some(c=>c.name==='揽月'))throw Error('双人局出现揽月');
  if(s.phase==='response'&&!s.pending)throw Error('缺失待结算攻击');
  return true;
 }
}
function cardValue(c,v){
 const p=v.self,h=p.hand;
 if(c.type==='tool'){
  if(c.name==='恢复')return p.hp<3?36:22;
  if(c.name==='护盾')return p.hasShield?7:29;
  if(c.name==='掠夺')return 24;
  return p.hp<=2?18:9;
 }
 const danger=ELEMENTS.find(e=>BEATS[e]===p.element),counter=COUNTER[danger];
 const n=h.filter(a=>a.element===c.element).length;
 return 13+(c.element===counter?9:0)+(n<=2?6:0)+v.players.some(t=>t.alive&&t.id!==p.id&&v.dist[p.id][t.id]===1&&BEATS[c.element]===t.element)*5;
}
const Bot={
 choose(v,random=Math.random){
  const p=v.self,base={actor:p.id,rev:v.rev},easy=p.level==='easy',hard=p.level==='hard';
  if(v.phase==='response'){
   const hit=v.pending,correct=p.hand.filter(c=>c.element===COUNTER[hit.element]).slice(0,hit.damage);
   if(easy&&p.hp>hit.damage&&random()<.15)return {...base,kind:'respond',mode:'take'};
   const costly=hard&&correct.reduce((n,c)=>n+cardValue(c,v),0)>34;
   if(p.hasShield&&(hit.damage===2||correct.length<hit.damage||costly))return {...base,kind:'respond',mode:'shield'};
   if(correct.length)return {...base,kind:'respond',mode:'counter',cards:correct.map(c=>c.id)};
   if(p.hasShield)return {...base,kind:'respond',mode:'shield'};
   return {...base,kind:'respond',mode:'take'};
  }
  if(v.phase==='discard'){
   const n=p.hand.length-p.hp*2;
   const cards=easy?p.hand.map(c=>({c,value:random()})):p.hand.map(c=>({c,value:cardValue(c,v)+random()*.1}));
   return {...base,kind:'discard',cards:cards.sort((a,b)=>a.value-b.value).slice(0,n).map(a=>a.c.id)};
  }
  if(v.phase!=='action')return null;
  const live=v.players.filter(t=>t.alive&&t.id!==p.id),options=[],attacks=[];
  if(!v.used.attack){
   const used=new Set();
   for(const c of p.hand.filter(c=>c.type==='element')){
    if(used.has(c.element))continue;used.add(c.element);
    for(const t of live.filter(t=>v.dist[p.id][t.id]===1)){
     const damage=BEATS[c.element]===t.element?2:1;
     const likelyKill=t.hp<=damage&&!t.hasShield;
     let score=damage*15+(likelyKill?75:0)+(4-t.hp)*3-(t.hasShield?17:0);
     if(hard)score-=Math.min(t.handCount,7)*(likelyKill?5:1)+cardValue(c,v)*.16;
     const o={score,kind:'attack',card:c.id,target:t.id,damage,likelyKill};options.push(o);attacks.push(o);
    }
   }
  }
  const shields=p.hand.filter(c=>c.name==='护盾');if(!p.hasShield&&shields.length)options.push({score:p.hp<=2?67:37,kind:'tool',card:shields[0].id});
  if(!v.used.tool){
   for(const name of ['恢复','掠夺','揽月']){
    const c=p.hand.find(c=>c.name===name);if(!c)continue;
    if(name==='恢复'){
     if(p.hp<4)options.push({score:p.hp<=2?91:29,kind:'tool',card:c.id,target:p.id});
     if(easy)for(const t of live.filter(t=>t.hp<4))options.push({score:8,kind:'tool',card:c.id,target:t.id});
    }

 return `<section class="room-page"><div class="room-heading"><div><p class="kicker">ONLINE ROOM</p><h1 class="serif">${team?'并肩，入局。':'等好友，入席。'}</h1><p class="muted">${team?'A/B两队各2人，击败对方全员。':'每回合2次攻击机会（含身份替换）＋3张主动道具，护盾额外预置。'}</p></div><span class="pill active"><span class="dot"></span><span id="net-status">${online.status==='connected'?'已连接':'同步中'}</span></span></div><div class="room-grid"><div class="setup-panel"><div class="room-code"><span class="kicker">房间码</span><strong>${r.code}</strong><span class="pill">${r.members.length}/${max}人</span></div><div class="share-line"><input readonly id="share-link" value="${esc(link)}" aria-label="邀请链接">${button('复制邀请','net-copy','small outline')}</div><div class="form-line" style="margin-top:20px"><label class="form-label" for="room-game-mode">对战玩法</label><select id="room-game-mode" data-net-mode ${!r.isHost||online.busy?'disabled':''}><option value="ffa" ${!team?'selected':''}>自由混战</option><option value="team" ${team?'selected':''}>2v2组队</option></select></div><div class="room-members">${r.members.map(m=>`<div class="room-member"><span class="member-avatar ${team?'team-'+m.team:''}">${m.seat+1}</span><div class="member-main"><strong>${esc(m.name)}${m.seat===r.playerId?' · 你':''}</strong><small>${m.isHost?'房主 · ':''}${m.type==='bot'?levels[m.level]+'人机':m.online?'在线':'暂时离线'}</small></div>${team?(r.isHost?`<select data-net-team="${m.uid}" aria-label="${esc(m.name)}队伍"><option value="0" ${m.team===0?'selected':''}>A队</option><option value="1" ${m.team===1?'selected':''}>B队</option></select>`:`<span class="team-tag team-${m.team}">${teamLabel(m)}</span>`):''}${m.type==='bot'&&r.isHost?`<select data-net-level="${m.uid}" aria-label="人机难度">${Object.entries(levels).map(([k,v])=>`<option value="${k}" ${m.level===k?'selected':''}>${v}</option>`).join('')}</select>${button('移除','net-remove-bot','quiet small',`data-uid="${m.uid}"`)}`:`<span class="pill ${m.ready?'active':''}">${m.ready?'已准备':'等待准备'}</span>`}</div>`).join('')}</div><div class="room-controls">${r.isHost?button('＋ 添加人机','net-add-bot','outline',r.members.length>=max||online.busy?'disabled':''):button(me.ready?'取消准备':'我准备好了','net-ready',me.ready?'outline':'primary',online.busy?'disabled':'')}${r.isHost?button('开始对局 '+svg('arrow'),'net-start','primary',!canStart||online.busy?'disabled':''):'<span class="muted">等待房主开局</span>'}</div>${!canStart?`<p class="setup-note">${team?'需要4人、A/B队各2人，且真人均准备。':'至少2人，且所有真人准备。'}</p>`:''}</div><aside class="info-box room-help"><p class="kicker">A SHARED TABLE</p><h2>新牌组，新战术。</h2><p>${facts.total}张牌，${facts.elements}张元素与${facts.toolCount}张道具进入牌组。7血开局、环形距离；2次攻击机会＋最多3张主动道具，护盾不占次数。</p><p>双雕连续攻击两名敌方；神罚与祭祀强制弃牌；无效可在回合外取消道具；交换与禁锢改变局势。</p><p>联机道具有8秒无效响应窗，其他玩家均可响应。人数不足时，可添加三档人机。</p><p>离线90秒人机代打；本机重连恢复席位。房间最后活动24小时后过期。</p>${button('离开房间','net-leave','outline wide')}</aside></div></section>`;
}

function audioDialog(){return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="audio-title"><div class="modal-head"><div><p class="kicker">SOUNDS OF FIVE ELEMENTS</p><h2 id="audio-title">音乐与音效</h2></div>${button(svg('close'),'close','quiet','aria-label="关闭声音设置"')}</div><p class="intro">圣咏低吟，战鼓与失真吉他渐起。<br>声音在首次点击后启用，偏好保存在当前设备。</p>${[['music','musicVolume','背景音乐','合成圣咏、战鼓、铜管与摇滚吉他；残局自动加速'],['effects','effectsVolume','游戏音效','金属攻击、克制钟声、水晶护盾、五行身份与16种圣物音色']].map(([toggle,volume,title,desc])=>`<div class="audio-setting"><div class="audio-label"><label for="audio-${toggle}">${title}<small>${desc}</small></label><input id="audio-${toggle}" type="checkbox" data-audio="${toggle}" ${audio.pref[toggle]?'checked':''}></div><div class="audio-volume"><input type="range" min="0" max="100" value="${Math.round(audio.pref[volume]*100)}" data-audio="${volume}" aria-label="${title}音量"><output id="out-${volume}">${Math.round(audio.pref[volume]*100)}%</output></div></div>`).join('')}<div class="audio-setting motion-setting"><div class="audio-label"><label for="reduced-motion">减少动态效果<small>${motionMedia?.matches?'系统已启用：使用静态元素纹理与简短身份提示':'停用持续流光，身份更替使用简短提示；不影响出牌与结算'}</small></label><input id="reduced-motion" type="checkbox" data-motion="reduced" ${motionReduced()?'checked':''} ${motionMedia?.matches?'disabled':''}></div></div><p class="setup-note">${audio.supported===false?'此浏览器暂不支持声音合成。':'切换到后台时音乐暂停，回到游戏后继续。'}</p>${button('试听音效','audio-test','outline wide')}</section></div>`;}
function save(){if(!game||isOnline())return;try{saved={version:1,date:Date.now(),game:game.s,viewer:ui.viewer,paused:ui.paused,deathAck:ui.deathAck};localStorage.setItem(KEY,JSON.stringify(saved));ui.saveError=false;}catch{ui.saveError=true;}}
function cancelBot(){epoch++;clearTimeout(botTimer);botTimer=null;botJob=null;}
function blocked(){return !!(ui.handoff!==null||ui.dialog||game?.s.phase==='over');}
function button(text,act,style='',attrs=''){
 const role=game?.actor();return `<button type="button" class="btn ${style}" data-act="${act}" ${game?`data-rev="${game.s.rev}" data-owner="${role?.id??''}"`:''} ${attrs}>${text}</button>`;
}
function maxHp(){return game?.s.maxHp||(game?.s.version<3?4:7);}
function portrait(e,cls='portrait-art'){return `<span class="${cls} supplied-portrait" style="--portrait-image:url('${PORTRAITS[e]}')" aria-hidden="true"></span>`;}
function battleEffects(){const b=ui.burst;if(!b)return '';return `<div class="battle-impact impact-${b.kind}" aria-live="polite"><span>${esc(b.label)}</span></div>`;}
function limits(){const base=game?.s.limits||(game?.s.version===1?{attack:1,tool:1}:{attack:2,tool:3});return {...base,attack:game?.s.rulesRevision>=7&&game.s.players[game.s.turn]?.attackRestricted?1:base.attack};}
function enemy(p,t){return p.id!==t.id&&(game?.s.mode!=='team'||p.team!==t.team);}
function clearChoice(keepBrowse=false){const browse=ui.handBrowse,page=ui.handPage;ui.selected=[];ui.target=null;ui.aux=null;ui.targets=[];ui.extras=[];clearPreview();ui.handBrowse=keepBrowse?browse:null;ui.handPage=keepBrowse?page:0;if(!keepBrowse)browserPageSize=0;}
function teamLabel(p){return p.team===0?'A队':p.team===1?'B队':'';}
function resultTitle(s){return s.mode==='team'?(new Set(s.winners.map(id=>s.players[id].team)).size>1?'两队并列获胜':teamLabel(s.players[s.winners[0]])+'获胜'):'对局结束';}
function targetAllowed(c,p,t){if(!t.alive)return false;if(c.type==='element')return enemy(p,t)&&game.s.dist[p.id][t.id]===1;if(c.name==='恢复')return t.hp<maxHp();if(c.name==='馈赠')return t.id!==p.id;if(c.name==='悬赏')return !game.s.bounties?.[t.id];if(c.name==='炼化')return enemy(p,t)&&game.s.dist[p.id][t.id]===1;if(c.name==='交换'||c.name==='透视')return t.id!==p.id&&hc(t)>0;if(['掠夺','神罚','禁锢','双雕','揽月'].includes(c.name)){if(!enemy(p,t))return false;if(c.name==='禁锢'&&game.s.rulesRevision>=7&&t.attackRestricted)return false;if(c.name==='揽月')return game.s.version>=3?!game.s.moons[p.id][t.id]&&game.s.dist[p.id][t.id]<3:game.s.dist[p.id][t.id]===1;return true;}return false;}

// Every tool uses these shared surfaces; an unregistered future name still receives a complete fallback.
function toolMeta(name){const revision=game?(game.s.rulesRevision||game.s.version):8;if(revision<7&&OLD_TOOL_RULES[name])return {...TOOL_UI[name],...OLD_TOOL_RULES[name]};return TOOL_UI[name]||{key:'codex',en:'THE NEW RELIC',icon:'book',tone:'#8c7047',group:'道具',scope:'按牌面指定',effect:tips[name]||'查看道具说明',detail:tips[name]||'按本牌的效果选择目标并确认使用。',steps:['阅读本牌效果','选择合法目标','确认后结算']};}
function deckFacts(){const revision=game?(game.s.rulesRevision||game.s.version):8,cards=revision===1?ElementLegacy.catalogue():revision===2?ElementV2.catalogue():ElementGame.catalogue(revision),tools={};for(const c of cards)if(c.type==='tool')tools[c.name]=(tools[c.name]||0)+1;const elements=cards.filter(c=>c.type==='element').length,toolCount=cards.filter(c=>c.type==='tool').length;return {revision,total:cards.length,elements,perElement:elements/5,tools,toolCount,drawPile:elements+toolCount,twoPlayerPile:elements+toolCount-(tools.揽月||0)};}
function activeTools(){return deckFacts().tools;}
const TOOL_ART={掠夺:0,恢复:1,揽月:2,护盾:3,双雕:4,神罚:5,祭祀:6,无效:7,交换:8,禁锢:9,透视:10,友谊长存:11,整备:12,馈赠:13,炼化:14,悬赏:15};
function relicArt(c,extra=''){
 const i=c.type==='element'?ELEMENTS.indexOf(c.element):(TOOL_ART[c.name]??-1),columns=c.type==='element'?3:4,rows=c.type==='element'?2:4;
 if(i<0||c.type==='element'&&i>=5)return `<span class="tool-medallion">${svg(c.element||toolMeta(c.name).icon,38)}</span>`;
 return `<span class="card-illustration ${c.type==='element'?'element-illustration':'tool-illustration'} ${extra}" style="--atlas-x:${i%columns/(columns-1)*100}%;--atlas-y:${Math.floor(i/columns)/(rows-1)*100}%" aria-hidden="true"></span>`;
}
function elementFace(c,label){return `<img class="supplied-card-face" src="${ELEMENT_FACES[c.element]}" alt="" draggable="false" decoding="async"><span class="card-accessible">${esc(c.name)}：${esc(label||'克'+BEATS[c.element]+' · '+COUNTER[c.element]+'反制')}</span>`;}
function toolFace(c,label){const m=toolMeta(c.name),art=TOOL_FACES[c.name];if(!art)return `<span class="card-type">${m.group}</span><span class="card-glyph">${esc(c.name)}</span><span class="tool-medallion">${svg(m.icon,38)}</span><span class="card-note">${esc(label||m.effect)}</span>`;return `<img class="supplied-card-face" src="${art}" alt="" draggable="false" decoding="async"><span class="card-accessible">${esc(c.name)}：${esc(label||m.effect)}</span>`;}

function toolPreview(c,p){
 const s=game.s,name=c.name,all=s.players.filter(t=>t.alive),targets=name==='友谊长存'?all:name==='祭祀'?all.filter(t=>t.id!==p.id):name==='护盾'||name==='整备'?[p]:name==='双雕'?all.filter(t=>ui.targets.includes(t.id)):all.filter(t=>t.id===ui.target),extra=p.hand.find(a=>a.id===ui.aux);
 const result=t=>name==='整备'?`弃 ${ui.extras.length} ⇄ 摸 ${ui.extras.length} 张`:name==='馈赠'?'交出1张 → 自己摸1张':name==='炼化'?`${p.element} · ${game.damage({element:p.element},t)}点伤害`:name==='悬赏'?'按实际攻击扣血摸牌 · 累计≤2':name==='友谊长存'||name==='恢复'?`${t.hp} → ${Math.min(maxHp(),t.hp+1)} 血`:name==='透视'?`私下查看 ${Math.min(2,hc(t))} 张`:name==='神罚'?`弃 ${Math.min(2,hc(t))} 张`:name==='掠夺'?`获得 ${Math.min(s.rulesRevision>=7?1:2,hc(t))} 张`:name==='揽月'?`距离 ${s.dist[p.id][t.id]} → ${Math.min(3,s.dist[p.id][t.id]+1)}`:name==='双雕'?(extra?`${game.damage(extra,t)} 点伤害`:'待选择元素牌'):name==='祭祀'?`弃「${t.element}」牌，否则−1血`:name==='禁锢'?(s.rulesRevision>=7?'下回合攻击机会 2 → 1':'可摸牌 · 不可出牌'):name==='交换'?'交出1张 ⇄ 随机1张':name==='护盾'?'抵消一次完整攻击':'取消整张道具';
 return `<div class="tool-effect-preview" aria-label="效果预览">${targets.length?targets.map(t=>`<span><b>${esc(t.name)}</b><small>${esc(result(t))}</small></span>`).join(''):'<span class="pending-target">先选择目标，查看本次效果</span>'}</div>`;
}
function toolFocus(c,p,preview=true){const m=toolMeta(c.name),free=c.name==='护盾',response=c.name==='无效';return `<section class="tool-focus tool-${m.key}" style="--tool-tone:${m.tone}" aria-label="${esc(c.name)}使用界面"><span class="focus-icon">${svg(m.icon,30)}</span><div class="focus-copy"><p class="kicker">${m.en}</p><h3>${esc(c.name)} <small>${m.group}</small></h3><p>${esc(c.name==='祭祀'&&(game.s.rulesRevision||game.s.version)<4?'其他玩家弃1张自身身份元素牌；旧版无牌时跳过。':m.detail)}</p><div class="tool-tags"><span>${m.scope}</span><span>${response?'回合外响应':free?'护盾额外预置':c.name==='炼化'?'道具1次＋攻击1次':'主动道具 1/3'}</span>${c.name==='透视'?'<span>仅自己可见</span>':''}</div></div>${button('详解','tool-detail','quiet small',`data-tool="${esc(c.name)}"`)}</section>${preview?toolPreview(c,p):''}`;}
function toolLibrary(){return `<div class="tool-library">${Object.entries(activeTools()).map(([name,count])=>{const m=toolMeta(name);return `<button type="button" class="tool-library-item" data-act="tool-detail" data-tool="${esc(name)}" style="--tool-tone:${m.tone}"><span>${svg(m.icon,26)}</span><div><b>${esc(name)} <small>${count}张</small></b><p>${m.effect}</p></div>${svg('arrow',14)}</button>`;}).join('')}</div>`;}
function toolDialog(){
 const name=ui.toolDetail,m=toolMeta(name),count=activeTools()[name]??TOOLS[name]??'—';return `<div class="modal-backdrop"><section class="modal tool-detail-modal" role="dialog" aria-modal="true" aria-labelledby="tool-title"><div class="modal-head"><div><p class="kicker">RELIQUARY · 道具图鉴</p><h2 id="tool-title">${name?esc(name):'圣物图鉴'}</h2></div>${button(svg('close'),'close','quiet','aria-label="关闭道具图鉴"')}</div>${name?`<div class="tool-detail-body" style="--tool-tone:${m.tone}"><article class="play-card tool relic-display tool-${m.key}" aria-label="${esc(name)}卡面">${toolFace({name})}</article><div class="tool-detail-copy"><p class="kicker">${m.en}</p><p class="tool-description">${m.detail}</p><div class="tool-tags"><span>${count}张</span><span>${m.group}</span><span>${m.scope}</span></div><ol class="tool-steps">${m.steps.map(step=>`<li>${esc(step)}</li>`).join('')}</ol><p class="tool-response-note">${name==='无效'?'在其他道具的响应窗口使用，不占主动道具次数。':name==='护盾'?'护盾不占主动次数。预置时可被无效取消，使用中的护盾不能抵消祭祀扣血。':name==='炼化'?'同时占1次主动道具和1次基础攻击机会，可被「无效」取消。':'占1次主动道具机会，可被「无效」取消。'}</p></div></div>${button('查看全部道具','tool-library','outline wide')}`:`<p class="intro">每一件圣物，都有自己的力量。<br>${Object.keys(activeTools()).length}种道具 · 共${Object.values(activeTools()).reduce((a,b)=>a+b,0)}张，点击查看卡面与用法。</p>${toolLibrary()}`}</section></div>`;
}
function ownInsight(){return ui.handoff===null?game?.s.insights?.[ui.viewer]:null;}
function insightDialog(){const k=ownInsight();if(!k)return '';return `<div class="modal-backdrop"><section class="modal insight-modal" role="dialog" aria-modal="true" aria-labelledby="insight-title"><div class="modal-head"><div><p class="kicker">THE ORACLE · 仅你可见</p><h2 id="insight-title">${esc(game.s.players[k.target].name)}的手牌</h2></div>${button(svg('close'),'close','quiet','aria-label="关闭透视结果"')}</div><div class="insight-seal">${svg('eye',42)}</div><p class="intro">透视揭示了${k.cards.length}张牌，手牌仍留在对方手中。</p><div class="revealed-cards">${k.cards.map(c=>`<article class="play-card revealed-card ${c.type==='element'?classes[c.element]:'tool tool-'+toolMeta(c.name).key}" ${c.type==='tool'?`style="--tool-tone:${toolMeta(c.name).tone}"`:''}>${c.type==='tool'?toolFace(c):elementFace(c)}</article>`).join('')}</div><p class="setup-note">这是本次查看时的牌面，之后的手牌变化不会更新。<br>结果保留至你的下个回合开始。</p>${button('记住了，继续','close','primary wide')}</section></div>`;}

function homeBase(){
 const resumable=saved&&saved.game.phase!=='over',team=gameMode==='team',facts=deckFacts();
 const local=`<div class="setup-body"><div class="panel-heading"><div><p class="kicker">ASSEMBLE YOUR TABLE</p><h2>组一桌，开一局</h2></div><span class="pill">7血开局</span></div><div class="setup-options"><div class="form-line"><label for="game-mode" class="form-label">玩法</label><select id="game-mode" data-config="mode"><option value="ffa" ${!team?'selected':''}>自由混战</option><option value="team" ${team?'selected':''}>2v2组队</option></select></div><div class="form-line"><label for="player-count" class="form-label">人数</label><select id="player-count" data-config="count" ${team?'disabled':''}>${[2,3,4,5].map(n=>`<option value="${n}" ${config.length===n?'selected':''}>${n}人局</option>`).join('')}</select></div></div><div class="roster-heading seat-setup ${team?'team':''}"><span>席</span><span>玩家</span><span>类型</span><span>难度</span>${team?'<span>队伍</span>':''}</div><div class="setup-roster">${config.map((p,i)=>`<div class="seat-setup ${team?'team':''}"><span class="number">${String(i+1).padStart(2,'0')}</span><input value="${esc(p.name)}" maxlength="16" data-config="name" data-index="${i}" aria-label="玩家${i+1}名称"><select data-config="type" data-index="${i}" aria-label="玩家${i+1}类型"><option value="human" ${p.type==='human'?'selected':''}>真人</option><option value="bot" ${p.type==='bot'?'selected':''}>人机</option></select>${p.type==='bot'?`<select data-config="level" data-index="${i}" aria-label="玩家${i+1}人机难度">${Object.entries(levels).map(([k,v])=>`<option value="${k}" ${p.level===k?'selected':''}>${v}</option>`).join('')}</select>`:'<span class="human-label">轮流操作</span>'}${team?`<select data-config="team" data-index="${i}" aria-label="玩家${i+1}队伍"><option value="0" ${(p.team??i%2)===0?'selected':''}>A队</option><option value="1" ${(p.team??i%2)===1?'selected':''}>B队</option></select>`:''}</div>`).join('')}</div><div class="setup-tools"><small>${team?'固定4人，两队各2人':'至少保留1名真人'}</small>${button('一键补齐人机','fill','quiet small',config.length===(team?4:5)?'disabled':'')}</div><div class="pacing-note"><span>✦</span><p>人机每次思考 <b>2—4秒</b><small>留出观察牌局与思考的时间</small></p><span>II—IV</span></div><div class="difficulty-guide" aria-label="人机策略说明">${Object.entries(levelNotes).map(([key,note])=>`<span><b>${levels[key]}</b>${note}</span>`).join('')}</div><p class="setup-note">${config.length===2?'双人停用揽月 · 牌库'+facts.twoPlayerPile+'张':facts.elements+'张元素＋'+facts.toolCount+'张道具 · 牌库'+facts.drawPile+'张'} · 击败摸2张</p></div><div class="setup-dock">${resumable?button('继续对局','resume','outline'):''}${button('开始对局 '+svg('arrow'),'start','primary')}</div>`;

}

 if(isOnline()){ui.viewer=online.room.playerId;ui.handoff=null;return;}
 const role=game.actor(),humans=game.s.players.filter(p=>p.type==='human');
 if(humans.length===1){ui.viewer=humans[0].id;ui.handoff=null;}
 else if(role?.type==='human'&&ui.viewer!==role.id)ui.handoff=role.id;
 if(ui.viewer!==null){const p=game.s.players[ui.viewer];if(!p.alive&&game.s.phase!=='over'&&ui.handoff===null&&!ui.deathAck.includes(p.id)&&!ui.dialog){ui.deathAck.push(p.id);ui.dialog='death';}}
}

}
function seat(p,i,n){
 const s=game.s,positions={1:[[50,60]],2:[[50,88],[50,26]],3:[[50,88],[74,26],[26,26]],4:[[50,88],[85,56],[50,25],[15,56]],5:[[50,88],[86,57],[72,25],[28,25],[14,57]]},[x,y]=positions[n]?.[i]||[50,50],own=ui.viewer===p.id,d=ui.viewer===null?null:s.dist[ui.viewer][p.id],bounty=s.bounties?.[p.id],yn=n>=4&&(i===1||i===n-1)?64:y;
 return `<article data-seat="${p.id}" data-drop-player="${p.id}" class="seat ${classes[p.element]} ${s.turn===p.id?'current':''} ${own?'own':''} ${s.pending?.target===p.id?'targeted':''}" style="--x:${x}%;--y:${i===0&&!own?Math.min(74,y):y}%;--y-narrow:${i===0&&!own?Math.min(74,yn):yn}%" aria-label="${esc(p.name)}，${p.element}身份，${p.hp}血，${hc(p)}张手牌"><div class="seat-heading"><div class="seat-icon ${classes[p.element]}">${portrait(p.element,'seat-portrait')}${ElementRitual.ambientMarkup(p.element)}<b class="portrait-element">${p.element}</b></div><div class="seat-title"><span class="seat-name">${esc(p.name)}${own?' · 你':''}</span><small>席${p.id+1} · <b class="${classes[p.element]}">${p.element}</b> · ${p.type==='human'?'真人':levels[p.level]}</small></div>${s.mode==='team'?`<span class="team-tag team-${p.team}">${teamLabel(p)}</span>`:''}</div><div class="health-row"><span class="seat-element ${classes[p.element]}" aria-hidden="true">${p.element}</span><span class="hp-dots" aria-label="${p.hp}／${maxHp()}滴血">${Array.from({length:maxHp()},(_,n)=>n).map(n=>`<i class="hp-dot ${n<p.hp?'full':''}"></i>`).join('')}</span><b class="hp-number">${p.hp}<small>/${maxHp()}</small></b></div><div class="seat-meta"><span>手牌 ${hc(p)}</span><span class="distance-label ${d>1?'far':''}">${own?'本方身份':'距离 '+d}</span>${p.shield?`<span class="shield-mini" title="已有护盾">${svg('shield',11)}</span>`:''}${p.bound?'<span class="bound-tag">禁锢</span>':p.attackRestricted?'<span class="bound-tag" title="禁锢：下回合攻击机会减为1次" aria-label="禁锢：下回合攻击机会减为1次">限攻1</span>':''}</div>${bounty?`<div class="bounty-tag ${bounty.remaining===0?'paid':''}" title="${esc(s.players[bounty.owner].name)}悬赏，${s.rulesRevision>=7?'到其下回合开始前有效':'本回合结束取消'}">${svg('bounty',12)}<span>${esc(s.players[bounty.owner].name)}悬赏</span><b>已领${2-bounty.remaining}/2</b></div>`:''}<div class="seat-target-slot" data-target-slot="${p.id}">${seatTarget(p)}</div></article>`;

function stage(){
 const s=game.s,role=game.actor();
 if(s.phase==='over')return `<div class="center-stage"><div class="stage-mark">${svg('trophy',36)}</div><h2 class="stage-title">${resultTitle(s)}</h2>${ui.resultClosed?button('查看结果','result','quiet small'):''}</div>`;
 if(s.phase==='response'){const h=s.pending;return `<div class="center-stage response-stage"><p class="stage-label">${esc(s.players[h.attacker].name)} → ${esc(s.players[h.target].name)}</p><div class="hit-card ${classes[h.element]}"><b>${h.element}</b>${relicArt({type:'element',element:h.element})}</div><p class="stage-detail"><b>${h.damage}点伤害</b> · ${COUNTER[h.element]}反制</p>${thinking(role)}</div>`;}
 if(s.phase==='negation')return `<div class="center-stage"><p class="stage-label">${esc(s.players[s.toolContext.owner].name)}使用道具</p><div class="stage-mark">${svg(toolMeta(s.toolContext.card.name).icon,30)}</div><h2 class="stage-title">${s.toolContext.card.name}</h2><p class="stage-detail">等待无效响应</p>${thinking(role)}</div>`;
 if(s.phase==='forcedDiscard')return `<div class="center-stage"><p class="stage-label">${s.forced.source} · 强制弃牌</p><h2 class="stage-title">${esc(role.name)}</h2><p class="stage-detail">弃${s.forced.count}张${s.forced.element?'「'+s.forced.element+'」元素':''}牌</p>${thinking(role)}</div>`;
 return `<div class="center-stage"><div class="stage-mark">${svg('mark',38)}</div><p class="stage-label">TURN ${String(s.turnCount).padStart(2,'0')}</p><h2 class="stage-title">${s.phase==='discard'?'整理手牌':role?.id===ui.viewer?'轮到你了':esc(role?.name)}</h2><p class="stage-detail">${s.phase==='discard'?'结束弃到血量×2':role?.id===ui.viewer?'选牌，谋定而动':'五行流转 · 等待出牌'}</p>${thinking(role)}</div>`;
}

function thinking(role){return role?.type==='bot'?`<div class="thinking">${ui.paused||blocked()?'已暂停':'思考中 · 2—4秒'}${!ui.paused&&!blocked()?'<i></i><i></i><i></i>':''}</div>`:'';}
function distanceStrip(){const s=game.s,p=s.players[ui.viewer];if(!p?.alive)return '';return `<div class="distance-strip"><small>${s.version>=3?'环形座距 · 仅距离1可基础攻击':'玩家距离'}</small><div>${s.players.filter(t=>t.alive&&t.id!==p.id).map(t=>`<span class="${s.dist[p.id][t.id]===1?'near':'far'}">${esc(t.name)} <b>${s.dist[p.id][t.id]}</b>${s.moons?.[p.id]?.[t.id]?' ☾':''}</span>`).join('')}</div>${!s.players.some(t=>t.alive&&enemy(p,t)&&s.dist[p.id][t.id]===1)?'<p>暂无相邻敌方，可换身份或用双雕越距攻击。</p>':''}</div>`;}

function deckCounters(){const s=game.s;return `<div class="deck-counters">${button(svg('book',13)+'牌库 <b>'+(s.deckCount??s.deck.length)+'</b>','pile-deck','quiet small','aria-label="查看牌库说明"')}${button(svg('replay',13)+'弃牌 <b>'+(s.discardCount??s.discard.length)+'</b>','pile-discard','quiet small','data-pile="discard" aria-label="查看公开弃牌记录"')}</div>`;}
function sidebar(){
 if(!ui.intelOpen)return '';const s=game.s;
 return `<aside class="sidebar tabletop-drawer" aria-label="战术信息"><div class="drawer-head"><h2>${ui.intel==='tools'?'圣物图鉴':ui.intel==='reference'?'五行速查':'战斗记录'}</h2>${button(svg('close'),'intel-close','quiet small','aria-label="收起信息栏"')}</div><div class="intel-tabs" role="group" aria-label="战术信息">${button('记录','intel-logs',ui.intel==='logs'?'selected':'')}${button('五行速查','intel-reference',ui.intel==='reference'?'selected':'')}${button('道具','intel-tools',ui.intel==='tools'?'selected':'')}</div><div class="intel-content">${ui.intel==='tools'?toolLibrary():ui.intel==='reference'?`<p class="intel-note">克制目标身份造成2点伤害，反制牌每张抵消1点。</p><table class="ref-table"><thead><tr><th>攻击</th><th>克制</th><th>反制</th></tr></thead><tbody>${ELEMENTS.map(e=>`<tr><td><b class="${classes[e]}">${e}</b></td><td>${BEATS[e]}</td><td>${COUNTER[e]}</td></tr>`).join('')}</tbody></table><p class="intel-note">祭祀：${(s.rulesRevision||s.version)>=4?'弃自身身份元素牌，没有则扣1血。<br>护盾不能抵消祭祀扣血。':'旧版无匹配牌时跳过。'}</p>${distanceStrip()}`:`<div class="logs">${s.logs.slice(-35).reverse().map(l=>`<div class="log-item"><small>${l.turn?'R'+l.turn:'开局'}</small>${esc(l.text)}</div>`).join('')}</div>`}</div></aside>`;
}
function targeting(t){
 const s=game.s,p=s.players[ui.viewer],c=p?.hand.find(c=>c.id===ui.selected[0]),active=!!(p&&canInteract(p)&&s.phase==='action'&&c&&!['护盾','祭祀','友谊长存','整备'].includes(c.name));
 if(!active)return null;const legal=targetAllowed(c,p,t),selected=c.name==='双雕'?ui.targets.includes(t.id):ui.target===t.id;
 const base=c.name==='炼化'?{element:p.element}:c.name==='双雕'?p.hand.find(a=>a.id===ui.aux):c;
 const hint=c.type==='element'||c.name==='炼化'||c.name==='双雕'?`距离${s.dist[p.id][t.id]} · ${!base?'待附元素':game.damage(base,t)+'伤害'}`:c.name==='恢复'?`${t.hp} → ${Math.min(maxHp(),t.hp+1)}血`:c.name==='悬赏'?'悬赏 · 累计最多摸2张':c.name==='透视'?`查看${Math.min(2,hc(t))}张`:c.name==='揽月'?`距离${s.dist[p.id][t.id]} → ${Math.min(3,s.dist[p.id][t.id]+1)}`:`${t.hp}血 · 手牌${hc(t)}`;
 return {p,c,legal,selected,hint};
}
function seatTarget(t){
 const a=targeting(t);if(!a)return '';
 return `<button type="button" class="seat-target ${a.selected?'chosen':''}" data-act="target" data-target="${t.id}" data-owner="${a.p.id}" data-rev="${game.s.rev}" aria-label="选择${esc(t.name)}，${esc(a.hint)}${a.legal?'':'，不可指定'}" aria-pressed="${a.selected}" ${a.legal?'':'disabled'}><span class="seat-aim">${a.selected?'✓ ':''}${a.legal?esc(a.hint):'不可指定'}</span></button>`;
}

function playReason(c,p){
 const s=game.s,l=limits();if(s.phase!=='action'||s.turn!==p.id)return '等待你的行动回合';if(p.bound)return '禁锢中不可出牌';
 if(c.type==='element'){if(Number(s.used.attack)>=l.attack)return '基础攻击机会已用完';return s.players.some(t=>targetAllowed(c,p,t))||s.version>=3&&!s.used.identity&&c.element!==p.element||recoverAllowed(c,p)?'':'没有相邻敌方，且无法换身份或回元';}
 if(c.name==='无效')return '无效只能在道具响应窗口使用';
 if(c.name==='护盾'&&p.shield)return '已有护盾';
 if(!(s.version!==2&&c.name==='护盾')&&Number(s.used.tool)>=l.tool)return '主动道具次数已用完';
 if(['双雕','炼化'].includes(c.name)&&!p.hand.some(a=>a.type==='element'))return '还需要1张基础元素牌';
 if(c.name==='炼化'&&Number(s.used.attack)>=l.attack)return '炼化需要1次基础攻击机会';
 if(['交换','馈赠','整备'].includes(c.name)&&p.hand.length<2)return '还需要至少1张其他手牌';
 if(!['护盾','祭祀','友谊长存','整备'].includes(c.name)&&!s.players.some(t=>targetAllowed(c,p,t)))return '没有可指定的合法目标';return '';
}

function cardState(c,p,interactive){
 const s=game.s,main=p.hand.find(a=>a.id===ui.selected[0]),extra=s.phase==='action'&&main&&main.id!==c.id&&(['交换','馈赠','整备'].includes(main.name)||['双雕','炼化'].includes(main.name)&&c.type==='element'),selected=ui.selected.includes(c.id)||ui.aux===c.id||ui.extras.includes(c.id);let reason='',disabled=!interactive;
 if(interactive&&s.phase==='action'&&!extra){reason=playReason(c,p);disabled=!!reason;}
 if(interactive&&s.phase==='response'){reason=p.bound?'禁锢中不可反制':c.element!==COUNTER[s.pending.element]?'不是正确反制元素':'';disabled=!!reason;}
 if(interactive&&s.phase==='negation'){reason=c.name!=='无效'?'此时只能使用无效':'';disabled=!!reason;}
 if(interactive&&s.phase==='forcedDiscard'){reason=s.forced.element&&!(c.type==='element'&&c.element===s.forced.element)?'祭祀要求与身份相同的元素牌':'';disabled=!!reason;}
 const label=c.type==='element'?`克${BEATS[c.element]} · ${COUNTER[c.element]}反制`:c.name==='祭祀'&&(s.rulesRevision||s.version)<4?'弃自身元素牌，无则跳过':toolMeta(c.name).effect;
 return {selected,disabled,reason:reason||label,label};
}
function cardButton(c,p,interactive,order=0){
 const s=game.s,{selected,disabled,reason,label}=cardState(c,p,interactive);
 return `<button type="button" data-card-type="${c.type}" class="play-card ${c.type==='element'?classes[c.element]:'tool tool-'+toolMeta(c.name).key} ${selected?'selected':''} ${!interactive?'locked':''}" style="--card-order:${order};${c.type==='tool'?'--tool-tone:'+toolMeta(c.name).tone:''}" data-act="card" data-card="${c.id}" data-owner="${p.id}" data-rev="${s.rev}" ${disabled?'disabled':''} title="${esc(reason)}" aria-label="${esc(c.name)}，${esc(reason)}" aria-pressed="${selected}"><span class="card-edge-name" aria-hidden="true">${esc(c.name)}</span>${c.type==='tool'?toolFace(c,label):elementFace(c,label)}</button>`;
}

function canInteract(p){return !!(p&&game.actor()?.id===p.id&&p.alive&&!ui.paused&&!ui.dialog&&!online.busy&&game.s.phase!=='over');}

}
function hand(){
 const s=game.s,p=s.players[ui.viewer];if(!p||ui.handoff!==null)return `<section class="player-workbench duel-workbench hand-panel"><div class="privacy-hand">等待交接设备</div></section>`;
 const interactive=canInteract(p);
 return `<section class="player-workbench duel-workbench hand-panel" data-workbench data-phase="${s.phase}"><div class="hand-controls duel-controls" data-action-console aria-live="polite">${actionPanel(p,interactive)}</div>${identityShrine(p)}<section class="mixed-hand hand-zone" data-zone="all" aria-label="我的混合手牌"><div class="hand-pile-head">${button('我的手牌 <b>'+p.hand.length+'</b> · 点击展开','hand-expand','quiet small','data-zone="all" aria-label="展开全部手牌"')}<small>${s.phase==='action'&&interactive?'拖向人物出牌 · 拖向自己换身份':'悬停查看 · 点击选牌'}</small></div><div class="card-row mixed-card-row" tabindex="0" aria-label="混合手牌，元素与道具各有完整卡面；悬停查看或点击展开">${p.alive&&p.hand.length?p.hand.map((c,i)=>cardButton(c,p,interactive,i)).join(''):`<p class="no-hand">${p.alive?'暂无手牌':'已退场，继续观战'}</p>`}</div></section></section>`;

function handBrowser(){

function fitTable(){

 const m=TabletopUI.metrics(innerWidth,innerHeight);for(const [key,value]of Object.entries({header:m.header,status:m.status,top:m.top,card:m.card,console:m.console,dock:m.dock})){const property='--table-'+key,text=value+'px';if(app.style.getPropertyValue?.(property)!==text)app.style.setProperty(property,text);}

 for(const {row,width,cards}of rows){if(!width)continue;
  if(typeof TabletopUI.fan==='function'){
   const fan=TabletopUI.fan(width,cards.length,m.card*(5/7),m.card);for(const [key,value]of Object.entries({'--fan-height':fan.height+'px','--fan-card-width':(fan.cardWidth||m.card*(5/7))+'px','--fan-card-height':(fan.cardHeight||m.card)+'px'}))if(row.style.getPropertyValue?.(key)!==value)row.style.setProperty(key,value);row.dataset.packed=String(fan.packed);row.dataset.overflow=String(fan.overflow);
   cards.forEach((c,i)=>{const point=fan.items[i];if(!point)return;for(const [key,value]of Object.entries({x:point.x+'px',y:point.y+'px',rotate:point.rotate+'deg',z:point.z}))if(c.style&&c.style.getPropertyValue?.('--fan-'+key)!==String(value))c.style.setProperty('--fan-'+key,value);});
  }else{const pack=TabletopUI.pack(width,cards.length,m.card*(5/7));row.style.setProperty('--hand-step',pack.step+'px');row.dataset.packed=String(pack.packed);row.dataset.overflow=String(pack.overflow);}
 }

 if(ui.handBrowse&&browserPageSize!==m.pageSize){const slot=app.querySelector('[data-browser-slot]');if(slot)slot.innerHTML=handBrowser();}
 const arena=app.querySelector('.arena'),rect=arena?.getBoundingClientRect?.(),nodes=Array.from(app.querySelectorAll('[data-seat]'));
 if(rect?.width&&rect?.height&&nodes.length){const layout=TabletopUI.seats(rect.width,rect.height,nodes.length,nodes[0].classList.contains('own'));arena.dataset.seating=layout.mode;nodes.forEach((node,i)=>{const seat=layout.items[i];if(!seat)return;node.hidden=!!seat.hidden;for(const [key,value]of Object.entries({x:seat.x,y:seat.y,width:seat.width,height:seat.height}))node.style.setProperty('--seat-'+key,value+'px');});}
 updateInspector();flushBattleFeedback();
}

 const facts=deckFacts(),toolCounts=facts.tools,toolTotal=facts.toolCount,base=facts.elements;
 const descriptions={整备:TOOL_UI.整备.detail,馈赠:TOOL_UI.馈赠.detail,炼化:TOOL_UI.炼化.detail,悬赏:toolMeta('悬赏').detail,透视:TOOL_UI.透视.detail,友谊长存:TOOL_UI.友谊长存.detail,掠夺:toolMeta('掠夺').detail,恢复:'为自己或任意存活玩家恢复1血，最高7血。',揽月:'对一名敌方施加双方距离＋1。每对玩家限1次，最大距离3；死亡后保留存活玩家之间的效果。沿用双人开局停用揽月。',护盾:'自己回合预置，最多1个，不占3张主动道具次数。受攻击时可消耗，抵消整次伤害。',双雕:'附带消耗1张元素牌，指定2名不同敌方（只剩1名敌方时选1名），不受距离限制，不占基础攻击机会。逐人计算身份克制、反制和护盾；每击败一人都摸2张。',神罚:'指定一名敌方，由目标自选弃2张手牌，不足则全弃。',祭祀:'除出牌者外所有存活玩家（含队友），各弃1张与自身当前身份相同的基础元素牌；没有则扣1血。此扣血不受护盾或反制影响，导致退场时出牌者获得击败奖励。',无效:'响应其他玩家正在使用的道具，取消整张道具。可在回合外使用，不占主动次数，不连锁取消无效。',交换:'选自己除交换牌外的1张手牌，与另一名玩家的随机1张手牌交换。可选队友，双方须有牌。',禁锢:toolMeta('禁锢').detail};
 return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="rules-title"><div class="modal-head"><div><p class="kicker">CODEX · REVISION VIII</p><h2 id="rules-title">元素诀 · 七灯决战</h2></div>${button(svg('close'),'close','quiet','aria-label="关闭规则"')}</div>${game&&(game.s.rulesRevision||game.s.version)<8?`<p class="preview">此局沿用原有规则，不启用修订8的回元；新开局五行各25张、道具93张、总计234张，悬赏持续到施放者下回合开始，禁锢只减少攻击机会。${(game.s.rulesRevision||game.s.version)<4?'此旧局祭祀无匹配牌时跳过。':''}</p>`:''}<p class="intro">摸2张 → 2次攻击机会（攻击、替换身份和回元共享）＋最多3张主动道具 → 结束弃到血量×2。护盾额外预置，无效响应不占主动次数。</p><div class="rules-section"><h3>${base+toolTotal+16}张牌 · ${maxHp()}血开局</h3><p>五行各${facts.perElement}张，共${base}张元素；道具${toolTotal}张；人物10张；血量牌6张，每张${maxHp()}滴血。标准牌库${base+toolTotal}张；双人停用揽月，当前版牌库${base+toolTotal-(toolCounts.揽月||0)}张。每人获得2张人物选1张明置。</p><p>随机起始玩家7张手牌，其余5张。起始玩家第一回合跳过摸牌；其后每回合摸2张，按逆时针座号行动。恢复上限7；结束手牌上限为当前血量×2，护盾和明置身份不占手牌。</p><h3>牌桌操作</h3><p>自己的大身份圣像在底部左侧，七灯血量在人物下方。元素与道具混合收拢：使用本次提供的五行元素与道具卡面；悬停或聚焦查看说明，点击手牌标题展开分页。自己行动时，可将元素牌拖向合法敌方身份直接攻击，拖向自己可替换身份；道具拖向效果允许的身份使用。护盾、祭祀、友谊长存、整备拖向自己启动，双雕仍须选择足够目标，炼化、交换、馈赠仍须附带牌，整备仍须点击选1—2张。要求未齐时只保留选择，不出牌。也可点击选牌、选择发光目标并确认，便于键盘与触屏。防守、无效响应和弃牌使用点击选择与明确提交；非法或取消拖动不出牌。设置中包含声音、新对局、五行速查、道具图鉴、法典、记录与返回首页。牌库不展示未抽牌顺序。</p><h3>五行与攻击</h3><table><thead><tr><th>攻击</th><th>克制身份</th><th>反制牌</th></tr></thead><tbody>${ELEMENTS.map(e=>`<tr><td>${e}</td><td>${BEATS[e]}</td><td>${COUNTER[e]}</td></tr>`).join('')}</tbody></table><p>基础攻击只可指定距离1的敌方，消耗1张元素牌及1次攻击机会。普通伤害1，克制目标当前身份时2。每张正确反制牌抵消1点，也可消耗预置护盾抵消整次攻击，或承伤。</p><h3>回元 · 弃所克之牌，恢复1血</h3><p>修订8起，自己行动阶段，若未满血且尚有攻击机会，可选择1张当前身份所克制的基础元素牌，点击“回元 +1血”：弃置该牌，为自己恢复1血，最高7血，消耗1次攻击机会，不占主动道具次数。金弃木、木弃土、土弃水、水弃火、火弃金。两次机会可用于两次攻击、两次回元或混合使用；受到新版禁锢时只有1次共享机会。回元只作用于自己，不触发无效响应或护盾，不能在防守阶段使用；按回元时的当前身份判断，旧修订存档不启用。</p><h3>替换身份 · 每回合最多1次</h3><p>自己行动阶段，选1张与当前身份不同的基础元素牌，点击“替换身份”。新牌从手牌移到身份区，旧身份进入弃牌堆；消耗1次攻击机会，立即生效。每回合最多替换1次，与基础攻击、回元、炼化共享攻击机会；可先换身份再按新身份回元，也可少用机会。</p><p>原人物牌进入弃牌堆后，洗牌时移出，不作为手牌再摸到；曾作为身份的基础元素牌再次被替换后可正常洗回牌库。</p><h3>身份替换演出 · 仅视觉与音效</h3><p>每次成功替换身份，均按新身份元素触发一次对应演出：旧身份牌消解，旧牌飞入弃牌堆，新身份从特效中显现并明置。规则身份立即生效，动画不改变攻击、伤害、距离、手牌上限、牌库顺序或任何响应期限。当前仍每回合最多替换1次；未来若允许多次替换，每次独立触发。</p>${ElementRitual.rules().map(r=>`<p>${esc(r.text)}</p>`).join('')}<p>减少动态效果模式保留新旧身份提示和音效；演出不改变规则。修订8新增的回元按上节独立结算，不依赖动画完成。</p><h3>环形座位与揽月</h3><p>按存活座位的环形最短路径计算。5人时1号到2/5号距离1，到3/4号距离2；4人对座距离2；3人及2人基础距离均为1。有人退场即按剩余存活座位重算，再加上已有的揽月标记，最大3。</p><p>揽月不会自动解除。若残局没有相邻敌方，基础攻击暂不可用，可用双雕越距攻击；永久距离封锁可能延长对局。</p><h3>${Object.keys(toolCounts).length}种道具 · 共${toolTotal}张</h3>${Object.entries(toolCounts).map(([name,n])=>`<p><strong>${name} · ${n}张：</strong>${descriptions[name]||toolMeta(name).detail}</p>`).join('')}<h3>击败奖励与胜利</h3><p>使另一名玩家血量降到0时，击败者立即摸2张。奖励在下一次攻击结算及胜负确认前发放，手牌上限仍仅在自己的结束阶段检查。双雕击败两人可分别获得奖励。</p><p>退场玩家的手牌与护盾进入弃牌堆，身份和血量牌移出，相关距离标记移除。自由混战最后一名存活者胜；2v2对方全员退场时全队（含已退场队友）胜。</p><h3>2v2组队与结算补充</h3><p>固定4人，A/B各2人，默认交错入座，可开局前调整。不能攻击队友；掠夺、神罚、禁锢、揽月、双雕只可指定敌方。恢复、交换、馈赠可帮队友，祭祀也影响队友。炼化仅攻击距离1的敌方，仍消耗基础攻击机会；悬赏可指定任意存活玩家。透视仅出牌者可见；友谊长存也为敌方回血。手牌仍各自隐藏。</p><p>联机道具保留8秒无效响应窗，全部跳过提前结算。本机依次响应。无效取消整张道具；原牌及双雕、炼化附带元素不退，已占主动次数不退。护盾本来不占主动次数。</p><p>牌库空时洗弃牌堆。两堆均无可摸牌时，按存活血量、再按手牌数判胜，同分并列；2v2按存活队伍总血量和总手牌数比较。</p><h3>联机与决战音乐</h3><p>支持简单、中等、困难人机、房间码及断线重连；离线90秒由中等人机暂时代打。简单人机偏随机尝试，中等人机重视克制与恢复，困难人机会保留反制、救援队友并规划连招；只使用本人手牌和公开信息，人机每次出牌前思考2—4秒。声音首次点击后启用，可分别调音乐和音效。配乐使用合成圣咏质感、战鼓、铜管与失真吉他；进入双人残局或有玩家低于3血时加速。</p></div>${button('合上法典，继续','close','primary wide')}</section></div>`;
}

 if(ui.dialog==='death')return `<div class="modal-backdrop"><section class="modal center" role="dialog" aria-modal="true" aria-label="玩家已退场"><div class="modal-icon">${svg('shield',30)}</div><h2>这一局，先观战</h2><p class="intro">你的血量已归零。可以继续观看剩余玩家对战，或重新开局。</p>${button('继续观战','close','primary wide')}${button('重新开局','restart','quiet small')}</section></div>`;
 if(ui.handoff!==null){const p=game.s.players[ui.handoff];return `<div class="modal-backdrop"><section class="modal center" role="dialog" aria-modal="true" aria-label="交接设备"><div class="modal-icon">${svg('handoff',30)}</div><p class="kicker" style="margin-top:20px">PASS THE DEVICE</p><h2>${esc(p.name)}，请接手</h2><p class="intro">将设备交给这位玩家。<br>确认后才显示其手牌或身份候选。</p>${button('我已接手，显示我的牌','handoff','primary wide')}</section></div>`;}
 if(game?.s.phase==='over'&&!ui.resultClosed){const s=game.s,w=s.winners.map(id=>s.players[id]),team=s.mode==='team',hp=team?w.filter(p=>p.alive).reduce((n,p)=>n+p.hp,0):w[0]?.hp||0,cards=team?w.filter(p=>p.alive).reduce((n,p)=>n+hc(p),0):w[0]?hc(w[0]):0;return `<div class="modal-backdrop"><section class="modal center" role="dialog" aria-modal="true" aria-label="对局结果"><div class="modal-icon">${svg('trophy',30)}</div><p class="kicker" style="margin-top:20px">${w.length>1?'SHARED VICTORY':'VICTORY'}</p><h2>${team?resultTitle(s):w.map(p=>esc(p.name)).join('、')+'获胜'}</h2>${team?'<p class="intro">'+w.map(p=>esc(p.name)).join('、')+'</p>':''}<p class="intro">${esc(s.reason)}</p><div class="result-stats"><div><strong>${s.turnCount}</strong>回合</div><div><strong>${hp}</strong>${team?'获胜队伍总血量':'剩余血量'}</div><div><strong>${cards}</strong>${team?'获胜队伍总手牌':'手牌'}</div></div>${isOnline()?online.room.isHost?button('返回房间，再开一局','net-rematch','primary wide'):button('等待房主再开一局','net-rematch','primary wide','disabled'):button('再来一局','again','primary wide')}${button(isOnline()?'离开房间':'返回首页',isOnline()?'net-leave':'home','quiet small')} ${button('查看牌桌','close-result','quiet small')}</section></div>`;}
 return '';
}
function render(){
 gesture?.cancel('render');cancelTableRefresh();clearPreview();
 if(!game){feedbackQueue=[];present(()=>battleFX?.reset('home'));}
 present(()=>audio.setBattle?.(game?.s));preparePrivacy();syncPresentation();const insight=ownInsight();if(insight&&game.s.phase!=='over'&&game.s.players[ui.viewer]?.type==='human'&&!ui.dialog&&ui.peekSeen[ui.viewer]!==insight.id){ui.peekSeen[ui.viewer]=insight.id;ui.dialog='insight';}
 const key=game&&ui.handoff===null?(isOnline()?online.room.gameId:'local-'+presentationKey)+':'+ui.viewer:null,scroll=key&&app.dataset?.viewerKey===key?Array.from(app.querySelectorAll?.('.hand-zone .card-row')||[],el=>el.scrollLeft):[];
 const context=key+':'+game?.s.phase;if(ui.handContext!==context){if(game?.s.phase==='response'||game?.s.phase==='forcedDiscard'&&game.s.forced.element)ui.handTab='elements';else if(game?.s.phase==='negation')ui.handTab='tools';ui.handContext=context;}
 const table=isTableScene();if(app.dataset)app.dataset.scene=table?'table':'page';document.body?.classList?.toggle('tabletop-active',table);
 app.innerHTML=(table?'':header())+(isOnline()&&online.room.status==='lobby'?roomLobby():game?(game.s.phase==='identity'?identity():board()):home())+overlay()+battleEffects()+(table?inspector():'');ui.burst=null;
 if(app.dataset)app.dataset.viewerKey=key||'';if(scroll.length)Array.from(app.querySelectorAll?.('.hand-zone .card-row')||[]).forEach((el,i)=>{el.scrollLeft=scroll[i]||0;});
 requestTableRefresh(true);schedule();
}
function schedule(){
 if(isOnline()||!game||ui.paused||blocked()){if(botTimer!==null)cancelBot();return;}const role=game.actor();if(role?.type!=='bot'){if(botTimer!==null)cancelBot();return;}
 if(botJob?.game===game&&botJob.rev===game.s.rev&&botJob.id===role.id)return;cancelBot();const stamp=epoch,rev=game.s.rev,id=role.id;botJob={game,rev,id};
 botTimer=setTimeout(()=>{
  if(stamp!==epoch||!game||blocked()||ui.paused||game.s.rev!==rev||game.actor()?.id!==id)return;botTimer=null;botJob=null;
  const a=Bot.choose(game.publicView(id));if(!a){ui.paused=true;notify('人机未能生成操作，已暂停');render();return;}
  const before=soundSnapshot(game.s),result=game.dispatch(a);if(!result.ok){ui.paused=true;notify('人机操作异常：'+result.error);render();return;}
  clearChoice();save();present(()=>playSounds(before,game.s));render();
 },2000+Math.floor(Math.random()*2001));
}
function start(){
 cancelBot();try{game=new Game(config,{mode:gameMode});presentationKey++;rituals.reset();ui.viewer=null;ui.handoff=null;ui.dialog=null;clearChoice();ui.paused=false;ui.deathAck=[];ui.resultClosed=false;ui.peekSeen={};save();render();}catch(e){notify(e.message);}
}
function resume(){
 try{const x=readSave();if(!x)throw Error('没有可继续的存档');game=Game.restore(x.game);presentationKey++;rituals.reset();config=game.s.setup;gameMode=game.s.mode||'ffa';ui.viewer=x.viewer??null;ui.paused=!!x.paused;ui.deathAck=x.deathAck||[];ui.dialog=null;clearChoice();ui.resultClosed=false;
  const humans=game.s.players.filter(p=>p.type==='human');ui.handoff=humans.length>1?(game.actor()?.type==='human'?game.actor().id:ui.viewer??humans[0].id):null;render();
 }catch(e){game=null;notify('存档无法读取：'+e.message);render();}
}
function run(a){
 if(ui.paused||ui.handoff!==null||ui.dialog){notify('请先完成当前弹窗或继续游戏');return;}
 if(isOnline()){if(online.busy)return;onlineCommand({kind:'game',gameId:online.room.gameId,rev:a.rev,commandId:crypto.randomUUID(),action:a});return;}
 const before=soundSnapshot(game.s),result=game.dispatch(a);if(!result.ok){notify(result.error);return;}
 clearChoice();save();present(()=>playSounds(before,game.s));render();
}
function download(){
 notify('完整单文件离线包未随此网页版提供，请直接在浏览器中游玩');
}

function selectedAction(){
 const p=game?.s.players[ui.viewer],c=p?.hand.find(a=>a.id===ui.selected[0]);if(!c)return null;
 const multi=c.name==='双雕',free=['护盾','祭祀','友谊长存','整备'].includes(c.name),need=multi?Math.min(2,game.s.players.filter(t=>t.alive&&enemy(p,t)).length):1,extra=multi||['交换','馈赠','炼化'].includes(c.name);
 if(c.type==='element'&&!game.s.players[ui.target])return null;
 if(!free&&(multi?ui.targets.length!==need:ui.target===null))return null;
 if(extra&&!p.hand.some(a=>a.id===ui.aux))return null;
 if(c.name==='整备'&&(ui.extras.length<1||ui.extras.length>2))return null;
 return {kind:c.type==='element'?'attack':'tool',actor:p.id,rev:game.s.rev,card:c.id,target:ui.target,targets:ui.targets.slice(),extra:ui.aux,cards:ui.extras.slice()};
}
function replaceAllowed(c,p){return game.s.version>=3&&c.type==='element'&&c.element!==p.element&&!game.s.used.identity&&game.s.used.attack<limits().attack&&!p.bound;}
function recoverAllowed(c,p){const s=game.s;return !!(s.rulesRevision>=8&&s.phase==='action'&&s.turn===p.id&&p.alive&&!p.bound&&p.hp<maxHp()&&s.used.attack<limits().attack&&c?.type==='element'&&c.element===BEATS[p.element]);}
function dragContextValid(meta){const p=game?.s.players[ui.viewer];return !!(p&&canInteract(p)&&game.s.phase==='action'&&ui.handoff===null&&gameKey()===meta.gameKey&&game.s.rev===meta.rev&&p.id===meta.owner&&game.actor()?.id===meta.owner);}
function dragAllowed(cardId,targetId,meta){
 if(!dragContextValid(meta))return false;const p=game.s.players[meta.owner],c=p.hand.find(c=>c.id===cardId),t=game.s.players[Number(targetId)];if(!c||!t?.alive||playReason(c,p))return false;
 if(c.type==='element'&&p.id===t.id)return replaceAllowed(c,p);
 if(['护盾','祭祀','友谊长存','整备'].includes(c.name))return p.id===t.id;
 return targetAllowed(c,p,t);
}
function refreshDropTargets(){
 for(const el of app.querySelectorAll?.('[data-drop-player]')||[]){const id=Number(el.dataset.dropPlayer),valid=dragCard?dragAllowed(dragCard.id,id,dragCard.meta):false;el.classList.toggle('drop-legal',valid);el.classList.toggle('drop-hover',valid&&id===dragTarget);}
 if(app.dataset)app.dataset.dragging=dragCard?'true':'false';
}
function beginDrag(cardId,meta){
 const p=game?.s.players[ui.viewer],c=p?.hand.find(c=>c.id===cardId);if(!p||!c||!canInteract(p)||game.s.phase!=='action'||playReason(c,p))return false;
 const frozen={rev:game.s.rev,owner:p.id,gameKey:gameKey()};
 // Keep an already selected complex tool and its attachments on repeated drags.
 if(ui.selected[0]!==cardId){clearChoice(true);ui.selected=[cardId];}
 // The ghost was cloned before onStart, so reveal the portraits for a drop
 // from the expanded hand while keeping the chosen tool and attachments.
 if(ui.handBrowse){ui.handBrowse=null;browserPageSize=0;const browser=app.querySelector?.('[data-browser-slot]');if(browser)browser.innerHTML='';}
 clearPreview();dragCard={id:cardId,meta:frozen};dragTarget=null;refreshChoices();return frozen;
}
function dropCard(cardId,targetId,meta){
 if(!dragAllowed(cardId,targetId,meta))return false;
 const p=game.s.players[meta.owner],c=p.hand.find(c=>c.id===cardId),id=Number(targetId);dragCard=null;dragTarget=null;
 if(c.type==='element'&&id===p.id){run({kind:'replace',actor:p.id,rev:meta.rev,card:c.id});return true;}
 if(c.name==='双雕'){if(!ui.targets.includes(id)&&ui.targets.length<2)ui.targets.push(id);}else if(!['护盾','祭祀','友谊长存','整备'].includes(c.name))ui.target=id;
 const action=selectedAction();if(action){run(action);return true;}
 refreshChoices();notify(c.name==='双雕'?'继续选择另一目标和附带元素牌，再确认':'请点击附带手牌，再确认使用「'+c.name+'」');return true;
}
if(typeof ElementGesture!=='undefined')gesture=new ElementGesture.Controller({root:app,layer:document.getElementById('gesture-stage'),canStart:el=>{const p=game?.s.players[ui.viewer];return !!(p&&canInteract(p)&&game.s.phase==='action'&&ui.handoff===null&&!el.disabled);},onStart:beginDrag,canDrop:dragAllowed,onTarget:(id)=>{dragTarget=id===null?null:Number(id);refreshDropTargets();},onDrop:dropCard,onCancel:()=>{dragCard=null;dragTarget=null;refreshDropTargets();},onError:()=>notify('拖放已取消，请重新选择')});

app.addEventListener('click',e=>{

 }

 if(act==='net-rematch'||isOnline()&&act==='again'){if(online.room.isHost)onlineCommand({kind:'rematch'});else notify('请等待房主再开一局');return;}
 if(['intel-logs','intel-reference','intel-tools'].includes(act)){const tab=act==='intel-logs'?'logs':act==='intel-reference'?'reference':'tools';ui.intelOpen=b.dataset.toggleDrawer==='true'&&ui.intel===tab?!ui.intelOpen:true;ui.intel=tab;ui.handBrowse=null;if(ui.dialog){ui.dialog=null;render();}else refreshIntel();return;}
 if(act==='intel-close'){ui.intelOpen=false;refreshIntel();return;}
 if(act==='hand-tab'){ui.handTab=b.dataset.tab==='tools'?'tools':'elements';const el=app.querySelector?.('[data-workbench]');if(el){syncHandTabs(el);requestTableRefresh(true);}else render();return;}
 if(act==='hand-expand'){if(ui.handoff!==null||!game?.s.players[ui.viewer])return;ui.handBrowse=b.dataset.zone==='tools'?'tools':b.dataset.zone==='elements'?'elements':'all';ui.handPage=0;browserPageSize=0;ui.intelOpen=false;refreshBrowser();return;}
 if(act==='hand-collapse'||act==='hand-prev'||act==='hand-next'){if(act==='hand-collapse')ui.handBrowse=null;else ui.handPage+=act==='hand-next'?1:-1;refreshBrowser();return;}
 if(act==='tool-library'||act==='tool-detail'){ui.toolDetail=act==='tool-detail'?b.dataset.tool:null;ui.dialog='tool-detail';render();return;}
 if(act==='peek-result'&&ownInsight()){ui.dialog='insight';render();return;}
 if(act==='rules'){ui.dialog='rules';render();return;}
 if(act==='close'){ui.dialog=null;render();return;}
 if(act==='download'){download();return;}
 if(act==='start'){start();return;}
 if(act==='resume'){resume();return;}
 if(act==='fill'){const names=['青岚','听雨','赤霄','砚山'];while(config.length<(gameMode==='team'?4:5))config.push({name:names[config.length-1]||'人机'+config.length,type:'bot',level:'medium',team:config.length%2});render();return;}
 if(act==='pause'){ui.dialog=null;ui.paused=!ui.paused;save();render();return;}
 if(act==='restart'||act==='leave'){ui.dialog=act;render();return;}
 if(act==='again'){config=game.s.setup.map(p=>({...p}));gameMode=game.s.mode||'ffa';start();return;}
 if(act==='home'){cancelBot();save();rituals.reset();game=null;ui.dialog=null;ui.handoff=null;ui.resultClosed=false;saved=readSave();render();return;}
 if(act==='handoff'){ui.viewer=ui.handoff;ui.handoff=null;clearChoice();save();render();return;}
 if(act==='close-result'){ui.resultClosed=true;render();return;}
 if(act==='result'){ui.resultClosed=false;render();return;}
 if(!game||blocked()||ui.paused||online.busy)return;
 const actor=Number(b.dataset.owner),rev=Number(b.dataset.rev),role=game.actor();
 if(rev!==game.s.rev||role?.id!==actor||role.type!=='human'){notify('操作已过期，或正在等待其他玩家');return;}
 if(act==='cancel'){clearChoice();refreshChoices();return;}
 if(act==='card'){
  playFX('select');
  const id=b.dataset.card;
  if(game.s.phase==='action'){const main=role.hand.find(c=>c.id===ui.selected[0]),clicked=role.hand.find(c=>c.id===id);if(main&&main.id!==id&&main.name==='整备'){if(ui.extras.includes(id))ui.extras=ui.extras.filter(a=>a!==id);else if(ui.extras.length<2)ui.extras.push(id);else notify('整备最多选择2张其他手牌');}else if(main&&main.id!==id&&(['交换','馈赠'].includes(main.name)||['双雕','炼化'].includes(main.name)&&clicked.type==='element'))ui.aux=ui.aux===id?null:id;else{const same=ui.selected[0]===id;clearChoice(true);if(!same)ui.selected=[id];}}
  else{if(ui.selected.includes(id))ui.selected=ui.selected.filter(c=>c!==id);else{const max=game.s.phase==='response'?game.s.pending.damage:game.s.phase==='negation'?1:game.s.phase==='forcedDiscard'?game.s.forced.count:role.hand.length-role.hp*2;if(ui.selected.length>=max){notify('已选够'+max+'张，请先取消一张');return;}ui.selected.push(id);}}
  ui.intelOpen=false;if(game.s.phase==='action'&&['双雕','炼化'].includes(role.hand.find(c=>c.id===ui.selected[0])?.name))ui.handTab='elements';
  refreshChoices();const browse=app.querySelector?.('[data-browser-slot]');if(browse)browse.innerHTML=handBrowser();const drawer=app.querySelector?.('[data-intel-slot]');if(drawer)drawer.innerHTML='';return;
 }
 if(act==='target'){const id=Number(b.dataset.target),c=role.hand.find(c=>c.id===ui.selected[0]);if(!c||!game.s.players[id]||!targetAllowed(c,role,game.s.players[id]))return;if(c?.name==='双雕'){if(ui.targets.includes(id))ui.targets=ui.targets.filter(n=>n!==id);else if(ui.targets.length<2)ui.targets.push(id);else notify('双雕最多选择2名目标');}else ui.target=id;refreshChoices();return;}
 if(act==='identity'){run({kind:'identity',actor,rev,card:b.dataset.card});return;}
 if(act==='replace'){run({kind:'replace',actor,rev,card:ui.selected[0]});return;}
 if(act==='recover'){run({kind:'recover',actor,rev,card:ui.selected[0]});return;}
 if(act==='confirm'){const c=role.hand.find(c=>c.id===ui.selected[0]);if(c)run({kind:c.type==='element'?'attack':'tool',actor,rev,card:c.id,target:ui.target,targets:ui.targets.slice(),extra:ui.aux,cards:ui.extras.slice()});return;}
 if(act==='end'){run({kind:'end',actor,rev});return;}
 if(act==='discard'){run({kind:'discard',actor,rev,cards:ui.selected.slice()});return;}
 if(act==='forced-discard'){run({kind:'forcedDiscard',actor,rev,cards:ui.selected.slice()});return;}
 if(act==='pass-tool'){run({kind:'passTool',actor,rev,contextId:game.s.toolContext.id});return;}
 if(act==='negate'){const c=role.hand.find(c=>c.id===ui.selected[0]&&c.name==='无效')||role.hand.find(c=>c.name==='无效');if(c)run({kind:'negate',actor,rev,contextId:game.s.toolContext.id,card:c.id});return;}
 if(['counter','defend-shield','take'].includes(act))run({kind:'respond',actor,rev,mode:act==='counter'?'counter':act==='defend-shield'?'shield':'take',cards:ui.selected.slice()});
});

function hoverCard(e,leave=false,focus=false){
 if(dragCard)return;
 const b=e.target.closest?.('[data-act="card"]');if(!b)return;
 if(leave&&e.relatedTarget?.closest?.('[data-act="card"]')===b)return;
 const p=game?.s.players[ui.viewer];if(ui.handoff!==null||!p?.hand.some(c=>c.id===b.dataset.card))return;
 if(focus)previewFocus=leave?null:b.dataset.card;else previewPointer=leave?null:b.dataset.card;
 const next=previewPointer||previewFocus;if(ui.hoverCard===next)return;ui.hoverCard=next;requestTableRefresh();
}

 if(t.dataset.motion==='reduced'){reduceMotionChoice=t.checked;present(()=>localStorage.setItem(MOTION_KEY,reduceMotionChoice?'reduced':'full'));refreshMotion();return;}
 if(t.dataset.audio){if(t.type==='checkbox')return;audio.set(t.dataset.audio,Number(t.value)/100);const out=document.getElementById('out-'+t.dataset.audio);if(out&&out!==toastEl)out.textContent=t.value+'%';return;}
 if(t.dataset.net){online[t.dataset.net]=t.dataset.net==='code'?t.value.toUpperCase().replace(/[^A-Z2-9]/g,''):t.value;if(t.dataset.net==='code')t.value=online.code;return;}
 if(t.dataset.config==='name')config[Number(t.dataset.index)].name=t.value;

app.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.audio){if(t.type==='checkbox'){audio.set(t.dataset.audio,t.checked);present(()=>audio.unlock());}return;}
 if(t.dataset.netLevel){onlineCommand({kind:'bot-level',uid:t.dataset.netLevel,level:t.value});return;}

 render();
